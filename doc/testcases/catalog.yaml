  input: 41 skill + hồ sơ môi trường cố định (windows, fixed:8192)
  expected: Luôn trả về đúng cùng một tập skill qua mọi lần chạy
  intermediate: "—"
  evidence: {kind: pytest, tests: ["tests/unit/test_gr1_dataset.py::test_tier1_on_fixed_8192_windows",
                                    "tests/unit/test_constraint.py::test_parity_with_gr1_constraint_filter",
                                    "tests/unit/test_constraint.py::test_parse_ram_mode"],
             actual: "38 giữ, 3 loại (lý do os: chỉ chạy Linux); trùng bộ lọc GR1 ở 5 môi trường; chỉ chấp nhận fixed:<MB>"}
  note: "Lỗi GR1: phụ thuộc RAM trống (đã khoá bằng fixed:)"

