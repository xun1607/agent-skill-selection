# Danh mục testcase GR2. Sửa chữ ở đây; "Đầu ra thực tế" và "Kết quả" do scripts/build_testcase_workbook.py
# điền tự động từ bằng chứng máy ghi (evidence), không gõ tay.
# evidence.kind:
#   pytest     các test pytest (node id); Đạt nếu tất cả qua. Giá trị thực tế lấy từ record_property("actual")
#   gate       đọc benchmarks/gr1_internal/gate.json
#   reference  đọc benchmarks/reference/skillret_v1.1_test.json
#   selection  đọc artifacts/explorer/selection_cache.json
#   manual     đã kiểm tay (ghi rõ ngày và cách kiểm trong "actual")
#   planned    chưa chạy; "actual" ghi kế hoạch
# Testcase của từng baseline (TC-BL-...) được sinh tự động từ artifacts/compare/gr1.json, không liệt kê ở đây.

- id: TC-B01
  type: Đ
  component: Toàn hệ thống
  raw: RAW-01
  dataset: DS-1
  pre: Repo ở commit lỗi, test đang FAIL
  input: Mô tả nhiệm vụ sửa lỗi cú pháp Python
  expected: Sinh bản vá; test chuyển từ FAIL sang PASS
  intermediate: "—"
  evidence: {kind: planned, actual: "Giữa kỳ (Công việc 9): cần agent chạy thật. Môi trường đã sẵn sàng: cổng 6/6."}

