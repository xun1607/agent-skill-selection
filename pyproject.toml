[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-selection"
version = "0.1.0"
description = "Benchmark-first framework for context-aware skill selection in LLM agents"
readme = "README.md"
requires-python = ">=3.10"
# The retrieval core stays free of agent / LLM frameworks (no LangChain, LangGraph, sandbox, API clients).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional, loaded lazily: local multilingual encoder, OpenAI encoder (GR1 comparison), explorer UI
embed = ["sentence-transformers>=3.0", "transformers>=4.51", "torch"]
openai = ["openai>=1.30"]
app = ["streamlit>=1.35"]

[project.scripts]
skill-selection = "skill_selection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
